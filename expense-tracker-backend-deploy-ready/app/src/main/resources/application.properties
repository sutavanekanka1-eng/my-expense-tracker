spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:AuthService}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:WelcomeSql@123}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
# Railway (and most PaaS hosts) inject their own PORT env var - fall back to 9898 for local dev
server.port=${PORT:9898}
# Comma-separated list of allowed frontend origins, e.g. https://myapp.vercel.app,http://localhost:3000
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.org.springframework.security=DEBUG
logging.level.your.package.name=DEBUG