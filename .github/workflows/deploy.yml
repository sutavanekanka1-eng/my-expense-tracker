name: Deploy backend to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        working-directory: expense-tracker-backend-deploy-ready

        run: chmod +x gradlew

      # Build first so a broken commit fails here, before we ever touch Railway
      - name: Build with Gradle
        working-directory: expense-tracker-backend-deploy-ready

        run: ./gradlew :app:bootJar --no-daemon

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up ./expense-tracker-backend-deploy-ready --service ${{ secrets.RAILWAY_SERVICE_NAME }} --path-as-root

        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
